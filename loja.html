<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Loja — Catálogo de anúncios</title>
<meta name="description" content="Catálogo de produtos à venda. Veja fotos, preço e descrição e fale direto pelo WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:title" content="Minha Loja — Catálogo de anúncios">
<meta property="og:description" content="Veja os produtos disponíveis e fale direto pelo WhatsApp.">
<meta property="og:locale" content="pt_BR">
<meta name="theme-color" content="#0F5F4C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#EDF0EC;
  --surface:#FFFFFF;
  --surface-2:#F5F7F4;
  --ink:#1A1D24;
  --ink-soft:#586071;
  --line:#DCE1DB;
  --brand:#0F5F4C;
  --brand-ink:#0B4839;
  --brand-soft:#DFEFE8;
  --gold:#A8710F;
  --gold-soft:#F6EBD8;
  --shadow-sm:0 1px 2px rgba(20,30,25,.06), 0 6px 16px -10px rgba(20,30,25,.25);
  --shadow-lg:0 24px 60px -28px rgba(16,28,22,.45);
  --radius:14px;
  --radius-lg:22px;
  --maxw:1180px;
  --ease:cubic-bezier(.22,.8,.3,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161A; --surface:#181E23; --surface-2:#1F262C;
    --ink:#E9EDE8; --ink-soft:#9BA6A9; --line:#2C353B;
    --brand:#3DBF9B; --brand-ink:#8FE6CD; --brand-soft:#16332C;
    --gold:#E0B25E; --gold-soft:#332A19;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.6);
    --shadow-lg:0 30px 70px -30px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#11161A; --surface:#181E23; --surface-2:#1F262C;
  --ink:#E9EDE8; --ink-soft:#9BA6A9; --line:#2C353B;
  --brand:#3DBF9B; --brand-ink:#8FE6CD; --brand-soft:#16332C;
  --gold:#E0B25E; --gold-soft:#332A19;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.6);
  --shadow-lg:0 30px 70px -30px rgba(0,0,0,.8);
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:"Bricolage Grotesque","Inter",system-ui,sans-serif;font-weight:700;line-height:1.08;letter-spacing:-.02em;margin:0}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-ink);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:20px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;background:var(--surface);padding:10px 14px;border-radius:10px;z-index:100;transition:top .2s}
.skip:focus{top:12px}

/* ============================================================
   HEADER
   ============================================================ */
header.site{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.18rem;letter-spacing:-.03em;color:var(--ink);text-decoration:none;flex:0 0 auto}
.logo .mark{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:.9rem}
:root[data-theme="dark"] .logo .mark,
.logo .mark{color:#06120E}
.search{flex:1;position:relative;min-width:0}
.search input{
  width:100%;height:42px;padding:0 40px 0 40px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  transition:border-color .2s,box-shadow .2s;
}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);outline:none}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft);pointer-events:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ink-soft);cursor:pointer;padding:8px;border-radius:50%;line-height:0}
.search .clear:hover{background:var(--surface)}
.tools{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:transform .15s var(--ease),border-color .2s,background .2s}
.icon-btn:hover{transform:translateY(-1px);border-color:var(--brand)}
.ghost-btn{height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;transition:border-color .2s,transform .15s var(--ease)}
.ghost-btn:hover{border-color:var(--brand);transform:translateY(-1px)}
.only-wide{display:inline-flex}
@media (max-width:760px){
  .bar{height:auto;flex-wrap:wrap;padding-block:12px;row-gap:10px}
  .search{order:3;flex-basis:100%}
  .tools{margin-left:auto}
  .only-wide{display:none}
}

/* ============================================================
   HERO
   ============================================================ */
.hero{padding:56px 0 34px;position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:end}
.hero h1{font-size:clamp(2.3rem,6.2vw,4rem);max-width:12ch}
.hero p.lead{color:var(--ink-soft);font-size:1.08rem;max-width:44ch;margin:18px 0 0}
.counter{display:flex;gap:26px;align-items:flex-end;justify-content:flex-end;flex-wrap:wrap}
.stat{text-align:right}
.stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:2.4rem;line-height:1;letter-spacing:-.04em}
.stat span{font-size:.85rem;color:var(--ink-soft)}
.stat.live b{color:var(--brand)}
@media (max-width:860px){
  .hero{padding:34px 0 24px}
  .hero .wrap{grid-template-columns:1fr;gap:22px;align-items:start}
  .counter{justify-content:flex-start}
  .stat{text-align:left}
}

/* ============================================================
   FILTROS
   ============================================================ */
.filters{position:sticky;top:68px;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:12px 0;border-bottom:1px solid var(--line)}
@media (max-width:760px){.filters{top:0;position:static}}
.filters .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 15px;border-radius:999px;cursor:pointer;font-size:.92rem;transition:background .2s,color .2s,border-color .2s,transform .15s var(--ease)}
.chip:hover{transform:translateY(-1px);border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#06120E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#06120E}}
.selects{display:flex;gap:8px}
select.control{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;cursor:pointer}
select.control:hover{border-color:var(--brand)}

/* ============================================================
   GRID + CARDS
   ============================================================ */
main{padding:28px 0 70px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:22px;list-style:none;padding:0;margin:0}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s;
  animation:rise .45s var(--ease) both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.card .thumb{position:relative;aspect-ratio:4/3;background:var(--surface-2);overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.card:hover .thumb img{transform:scale(1.045)}
.badge{position:absolute;top:12px;left:12px;padding:6px 11px;border-radius:999px;font-size:.74rem;font-weight:600;letter-spacing:.01em;background:var(--brand-soft);color:var(--brand-ink);border:1px solid color-mix(in srgb,var(--brand) 30%,transparent)}
.badge.sold{background:var(--gold-soft);color:var(--gold);border-color:color-mix(in srgb,var(--gold) 35%,transparent)}
.badge.count{left:auto;right:12px;background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--ink-soft);border-color:var(--line)}
.card .body{padding:16px 17px 17px;display:flex;flex-direction:column;gap:7px;flex:1}
.card h3{font-size:1.06rem;font-weight:700}
.price{font-family:"Bricolage Grotesque",sans-serif;font-size:1.42rem;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
.card .excerpt{color:var(--ink-soft);font-size:.92rem;margin:0;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .actions{display:flex;gap:8px;margin-top:auto;padding-top:12px}
.btn{border:0;cursor:pointer;border-radius:11px;padding:11px 14px;font-weight:600;font-size:.94rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease),filter .2s,background .2s;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#06120E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#06120E}}
.btn.primary:hover{filter:brightness(1.07)}
.btn.outline{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.outline:hover{border-color:var(--brand)}
.btn.block{width:100%}
.btn[aria-disabled="true"],.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.card .actions .btn{flex:1}
.card.is-sold .thumb img{filter:grayscale(.75) contrast(.95)}

/* skeleton */
.skeleton{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;height:340px}
.skeleton .sk{background:linear-gradient(90deg,var(--surface-2) 25%,color-mix(in srgb,var(--line) 60%,var(--surface-2)) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:shimmer 1.3s infinite linear}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
.skeleton .sk.img{aspect-ratio:4/3}
.skeleton .sk.line{height:13px;border-radius:7px;margin:14px 17px}
.skeleton .sk.line.short{width:45%}

.empty{text-align:center;padding:70px 20px;border:1px dashed var(--line);border-radius:var(--radius-lg);background:var(--surface)}
.empty h3{font-size:1.3rem;margin-bottom:6px}
.empty p{color:var(--ink-soft);margin:0 0 16px}

/* ============================================================
   MODAL / DETALHE
   ============================================================ */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(10,18,15,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  background:var(--surface);border-radius:var(--radius-lg);width:min(980px,100%);max-height:92vh;overflow:auto;
  box-shadow:var(--shadow-lg);animation:pop .3s var(--ease) both;position:relative;
}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
.sheet .close{position:absolute;top:14px;right:14px;z-index:3}
.detail{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}
@media (max-width:820px){.detail{grid-template-columns:1fr}}
.gallery{position:relative;background:var(--surface-2)}
.gallery .stage{aspect-ratio:1/1;position:relative;overflow:hidden}
@media (max-width:820px){.gallery .stage{aspect-ratio:4/3}}
.gallery .stage img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity .35s var(--ease);cursor:zoom-in}
.gallery .stage img.on{opacity:1}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 90%,transparent);cursor:pointer;display:grid;place-items:center;transition:transform .18s var(--ease)}
.nav-arrow:hover{transform:translateY(-50%) scale(1.08)}
.nav-arrow.prev{left:12px}.nav-arrow.next{right:12px}
.dots{display:flex;gap:7px;justify-content:center;padding:12px}
.dot{width:8px;height:8px;border-radius:50%;border:0;background:var(--line);cursor:pointer;padding:0;transition:width .25s var(--ease),background .25s}
.dot[aria-current="true"]{width:22px;border-radius:999px;background:var(--brand)}
.info{padding:30px 30px 30px;display:flex;flex-direction:column;gap:14px}
@media (max-width:820px){.info{padding:22px 20px 26px}}
.info h2{font-size:clamp(1.5rem,3.6vw,2rem)}
.info .price{font-size:2.1rem}
.info .desc{color:var(--ink-soft);white-space:pre-line;margin:0;max-width:62ch}
.meta{font-size:.85rem;color:var(--ink-soft)}
.info .cta{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.info .cta .row{display:flex;gap:9px}
.info .cta .row .btn{flex:1}

.lightbox{position:fixed;inset:0;z-index:80;background:rgba(6,12,10,.94);display:flex;align-items:center;justify-content:center;animation:fade .2s var(--ease)}
.lightbox img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:10px;animation:pop .25s var(--ease) both}
.lightbox .close{position:absolute;top:18px;right:18px}
.lightbox .nav-arrow{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}

/* ============================================================
   ADMIN
   ============================================================ */
.admin{max-width:860px;margin:0 auto}
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:.88rem;font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:11px 13px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);outline:none}
.field textarea{min-height:110px;resize:vertical;font-family:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.two{grid-template-columns:1fr}}
.photo-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.photo-slot{position:relative;width:86px;height:86px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.photo-slot img{width:100%;height:100%;object-fit:cover}
.photo-slot button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1;font-size:.8rem;display:grid;place-items:center}
.hint{font-size:.83rem;color:var(--ink-soft);margin:0}
.rows{display:flex;flex-direction:column;gap:10px}
.row-item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.row-item img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:0 0 auto}
.row-item .t{flex:1;min-width:0}
.row-item .t strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .t span{font-size:.86rem;color:var(--ink-soft)}
.row-actions{display:flex;gap:6px}
.mini{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:.86rem}
.mini:hover{border-color:var(--brand)}
.mini.danger:hover{border-color:#C0392B;color:#C0392B}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:90;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease);box-shadow:var(--shadow-lg)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

footer.site{border-top:1px solid var(--line);padding:26px 0;color:var(--ink-soft);font-size:.9rem}
footer.site .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<a class="skip" href="#produtos">Ir para os produtos</a>

<header class="site">
  <div class="wrap bar">
    <a class="logo" href="#" id="brandLink">
      <span class="mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18l-1.5 11H4.5z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>
      </span>
      <span id="brandName">Minha Loja</span>
    </a>

    <div class="search" role="search">
      <span class="ico" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      </span>
      <label class="sr-only" for="q">Pesquisar produtos</label>
      <input id="q" type="search" placeholder="Pesquisar produtos…" autocomplete="off">
      <button class="clear" id="clearQ" hidden aria-label="Limpar pesquisa">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="tools">
      <button class="icon-btn" id="themeBtn" aria-label="Alternar tema"></button>
    </div>
  </div>
</header>

<section class="hero" id="hero">
  <div class="wrap">
    <div>
      <h1>Encontre o que você procura</h1>
      <p class="lead">Confira nossos produtos disponíveis. Gostou de algum? É só chamar no WhatsApp — a conversa já abre com o anúncio certo.</p>
    </div>
    <div class="counter">
      <div class="stat live"><b id="statAvail">0</b><span>à venda agora</span></div>
      <div class="stat"><b id="statSold">0</b><span>já vendidos</span></div>
      <div class="stat"><b id="statCats">0</b><span>categorias</span></div>
    </div>
  </div>
</section>

<section class="filters" id="filtros" aria-label="Filtros">
  <div class="wrap">
    <div class="chips" id="chips" role="group" aria-label="Categorias"></div>
    <div class="selects">
      <label class="sr-only" for="status">Status</label>
      <select id="status" class="control">
        <option value="todos">Todos</option>
        <option value="disponivel">Disponíveis</option>
        <option value="vendido">Vendidos</option>
      </select>
      <label class="sr-only" for="sort">Ordenar</label>
      <select id="sort" class="control">
        <option value="recentes">Mais recentes</option>
        <option value="menor">Menor preço</option>
        <option value="maior">Maior preço</option>
      </select>
    </div>
  </div>
</section>

<main>
  <div class="wrap">
    <h2 class="sr-only">Produtos</h2>
    <ul class="grid" id="produtos" aria-live="polite"></ul>
  </div>
</main>

<footer class="site">
  <div class="wrap">
    <span id="footBrand">Minha Loja</span>
    <span>Atendimento pelo WhatsApp <a id="footPhone" href="#">(38) 98406-2019</a></span>
  </div>
</footer>

<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
/* ============================================================
   1. CONFIGURAÇÃO — altere apenas aqui
   ============================================================ */
const CONFIG = {
  storeName: "Minha Loja",
  whatsapp: "5538984062019",          // formato internacional, só números
  whatsappLabel: "(38) 98406-2019",
  categories: ["Eletrônicos","Celulares","Informática","Móveis","Veículos","Casa","Outros"],
  storageKey: "minha-loja:produtos:v1",
  themeKey: "minha-loja:tema"
};

/* ============================================================
   2. CAMADA DE DADOS — Supabase (tabela loja_produtos)
   ============================================================ */
const Store = {
  items: [],
  erro: null,
  async load(){
    try{
      const { data, error } = await supabaseClient
        .from("loja_produtos")
        .select("*")
        .eq("ativo", true)
        .order("criado_em", { ascending:false });
      if(error) throw error;
      this.items = (data || []).map(normalizar);
    }catch(e){
      console.error("Erro ao carregar produtos:", e);
      this.erro = e;
      this.items = [];
    }
    return this.items;
  },
  get(id){ return this.items.find(p => String(p.id) === String(id)); }
};

// converte a linha do banco no formato usado pela vitrine
function normalizar(row){
  let fotos = row.fotos;
  if(typeof fotos === "string"){ try{ fotos = JSON.parse(fotos); }catch{ fotos = []; } }
  if(!Array.isArray(fotos)) fotos = [];
  fotos = fotos.filter(f => typeof f === "string" && f.trim());
  if(!fotos.length && row.foto_url) fotos = [row.foto_url];
  return {
    id: row.id,
    titulo: row.titulo || "Sem título",
    valor: Number(row.preco || 0),
    descricao: row.descricao || "",
    categoria: row.categoria || "Outros",
    status: row.status === "vendido" ? "vendido" : "disponivel",
    fotos: fotos.slice(0,5),
    dataCadastro: (row.criado_em || "").slice(0,10)
  };
}

    tv:'<rect x="76" y="86" width="248" height="150" rx="10" fill="'+fg+'" opacity=".92"/><rect x="90" y="100" width="220" height="122" rx="5" fill="'+bg+'" opacity=".75"/><rect x="176" y="236" width="48" height="10" rx="5" fill="'+fg+'" opacity=".92"/><rect x="146" y="246" width="108" height="10" rx="5" fill="'+fg+'" opacity=".92"/>',

/* ============================================================
   4. UTILITÁRIOS
   ============================================================ */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const brl = v => Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dataBR = iso => { const d=new Date(iso+"T12:00:00"); return isNaN(d)?"—":d.toLocaleDateString("pt-BR"); };
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

function whatsappLink(p){
  const msg = "Olá! Tenho interesse no produto: " + p.titulo + ".\n\n"
            + "Valor: " + brl(p.valor) + ".\n\n"
            + "Gostaria de obter mais informações.";
  return "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(msg);
}
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), 2600);
}

/* ============================================================
   5. TEMA
   ============================================================ */
const Theme = {
  init(){
    let saved = null;
    try{ saved = localStorage.getItem(CONFIG.themeKey); }catch{}
    const system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    this.set(saved || system, false);
    $("#themeBtn").addEventListener("click", () => {
      this.set(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true);
    });
  },
  set(mode, persist){
    document.documentElement.dataset.theme = mode;
    $("#themeBtn").innerHTML = mode === "dark" ? ICON.sun : ICON.moon;
    $("#themeBtn").setAttribute("aria-label", mode === "dark" ? "Usar tema claro" : "Usar tema escuro");
    if(persist){ try{ localStorage.setItem(CONFIG.themeKey, mode); }catch{} }
  }
};

/* ============================================================
   6. ESTADO DA VITRINE
   ============================================================ */
const State = { q:"", categoria:"todas", status:"todos", sort:"recentes" };

function filtered(){
  let list = Store.items.slice();
  if(State.categoria !== "todas") list = list.filter(p => p.categoria === State.categoria);
  if(State.status !== "todos")    list = list.filter(p => p.status === State.status);
  if(State.q.trim()){
    const q = norm(State.q);
    list = list.filter(p => norm(p.titulo).includes(q) || norm(p.descricao).includes(q) || norm(p.categoria).includes(q));
  }
  if(State.sort === "menor") list.sort((a,b)=>a.valor-b.valor);
  else if(State.sort === "maior") list.sort((a,b)=>b.valor-a.valor);
  else list.sort((a,b)=> (b.dataCadastro||"").localeCompare(a.dataCadastro||"") || b.id-a.id);
  return list;
}

function renderChips(){
  const cats = ["todas", ...CONFIG.categories];
  $("#chips").innerHTML = cats.map(c => {
    const on = State.categoria === c;
    const label = c === "todas" ? "Tudo" : c;
    const n = c === "todas" ? Store.items.length : Store.items.filter(p=>p.categoria===c).length;
    return '<button class="chip" data-cat="'+esc(c)+'" aria-pressed="'+on+'">'+esc(label)+' <span style="opacity:.6">'+n+'</span></button>';
  }).join("");
}

function renderStats(){
  $("#statAvail").textContent = Store.items.filter(p=>p.status==="disponivel").length;
  $("#statSold").textContent  = Store.items.filter(p=>p.status==="vendido").length;
  $("#statCats").textContent  = new Set(Store.items.map(p=>p.categoria)).size;
}

function cardHTML(p, i){
  const sold = p.status === "vendido";
  const foto = p.fotos?.[0] || demoPhoto("Sem foto","#E6E9E5","#586071","box");
  return '<li class="card'+(sold?' is-sold':'')+'" style="animation-delay:'+Math.min(i*45,360)+'ms">'
    + '<div class="thumb">'
      + '<img src="'+esc(foto)+'" alt="'+esc(p.titulo)+'" loading="lazy" decoding="async">'
      + '<span class="badge'+(sold?' sold':'')+'">'+(sold?'Vendido':'Disponível')+'</span>'
      + (p.fotos?.length>1 ? '<span class="badge count">'+p.fotos.length+' fotos</span>' : '')
    + '</div>'
    + '<div class="body">'
      + '<h3>'+esc(p.titulo)+'</h3>'
      + '<p class="price">'+brl(p.valor)+'</p>'
      + '<p class="excerpt">'+esc(p.descricao)+'</p>'
      + '<div class="actions">'
        + '<button class="btn outline" data-open="'+p.id+'">Ver detalhes</button>'
        + (sold
            ? '<button class="btn primary" aria-disabled="true" disabled>Vendido</button>'
            : '<a class="btn primary" href="'+whatsappLink(p)+'" target="_blank" rel="noopener" aria-label="Falar no WhatsApp sobre '+esc(p.titulo)+'">'+ICON.whats+' WhatsApp</a>')
      + '</div>'
    + '</div>'
  + '</li>';
}

function renderGrid(){
  const list = filtered();
  const grid = $("#produtos");
  if(!list.length){
    grid.innerHTML = '<li style="grid-column:1/-1"><div class="empty">'
      + '<h3>Nenhum produto encontrado</h3>'
      + '<p>Tente outra palavra na pesquisa ou volte para todas as categorias.</p>'
      + '<button class="btn outline" id="resetFilters">Mostrar tudo</button></div></li>';
    $("#resetFilters").onclick = () => {
      State.q=""; State.categoria="todas"; State.status="todos";
      $("#q").value=""; $("#status").value="todos"; $("#clearQ").hidden=true;
      renderChips(); renderGrid();
    };
    return;
  }
  grid.innerHTML = list.map(cardHTML).join("");
}

function showSkeletons(n=6){
  $("#produtos").innerHTML = Array.from({length:n}).map(()=>
    '<li class="skeleton"><div class="sk img"></div><div class="sk line"></div><div class="sk line short"></div><div class="sk line"></div></li>'
  ).join("");
}

/* ============================================================
   7. DETALHE + GALERIA + LIGHTBOX
   ============================================================ */
let lastFocus = null;

function openDetail(id){
  const p = Store.get(id);
  if(!p) return;
  lastFocus = document.activeElement;
  const sold = p.status === "vendido";
  const fotos = p.fotos?.length ? p.fotos : [demoPhoto("Sem foto","#E6E9E5","#586071","box")];

  $("#modalRoot").innerHTML =
  '<div class="overlay" data-overlay><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">'
  + '<button class="icon-btn close" data-close aria-label="Fechar">'+ICON.close+'</button>'
  + '<div class="detail">'
    + '<div class="gallery">'
      + '<div class="stage" id="stage">'
        + fotos.map((f,i)=>'<img src="'+esc(f)+'" alt="'+esc(p.titulo)+' — foto '+(i+1)+'" class="'+(i===0?'on':'')+'" data-i="'+i+'" tabindex="0" role="button" aria-label="Ampliar foto '+(i+1)+'">').join("")
        + (fotos.length>1 ? '<button class="nav-arrow prev" data-step="-1" aria-label="Foto anterior">'+ICON.left+'</button><button class="nav-arrow next" data-step="1" aria-label="Próxima foto">'+ICON.right+'</button>' : '')
      + '</div>'
      + (fotos.length>1 ? '<div class="dots" id="dots">'+fotos.map((_,i)=>'<button class="dot" data-dot="'+i+'" aria-current="'+(i===0)+'" aria-label="Foto '+(i+1)+'"></button>').join("")+'</div>' : '')
    + '</div>'
    + '<div class="info">'
      + '<span class="badge'+(sold?' sold':'')+'" style="position:static;align-self:flex-start">'+(sold?'Vendido':'Disponível')+'</span>'
      + '<h2 id="dlgTitle">'+esc(p.titulo)+'</h2>'
      + '<p class="price">'+brl(p.valor)+'</p>'
      + '<p class="desc">'+esc(p.descricao)+'</p>'
      + '<p class="meta">'+esc(p.categoria)+' · anunciado em '+dataBR(p.dataCadastro)+'</p>'
      + '<div class="cta">'
        + (sold
            ? '<button class="btn primary block" aria-disabled="true" disabled>Este produto já foi vendido</button>'
            : '<a class="btn primary block" href="'+whatsappLink(p)+'" target="_blank" rel="noopener">'+ICON.whats+' Tenho interesse pelo WhatsApp</a>')
        + '<div class="row"><button class="btn outline" data-share="'+p.id+'">'+ICON.share+' Compartilhar</button>'
        + '<button class="btn outline" data-close>Voltar ao catálogo</button></div>'
      + '</div>'
    + '</div>'
  + '</div></div></div>';

  const root = $("#modalRoot");
  let idx = 0;
  const imgs = $$("#stage img", root);
  const dots = $$("[data-dot]", root);
  function go(n){
    idx = (n + imgs.length) % imgs.length;
    imgs.forEach((im,i)=>im.classList.toggle("on", i===idx));
    dots.forEach((d,i)=>d.setAttribute("aria-current", String(i===idx)));
  }
  root.addEventListener("click", e => {
    const step = e.target.closest("[data-step]");
    const dot  = e.target.closest("[data-dot]");
    const img  = e.target.closest("#stage img");
    if(step) return go(idx + Number(step.dataset.step));
    if(dot)  return go(Number(dot.dataset.dot));
    if(img)  return openLightbox(fotos, idx, go);
    if(e.target.closest("[data-close]") || e.target.hasAttribute("data-overlay")) closeDetail();
    const sh = e.target.closest("[data-share]");
    if(sh) share(p);
  });
  root.addEventListener("keydown", e => {
    if(e.key === "Escape") closeDetail();
    if(e.key === "ArrowLeft") go(idx-1);
    if(e.key === "ArrowRight") go(idx+1);
    if((e.key === "Enter" || e.key === " ") && e.target.closest("#stage img")){ e.preventDefault(); openLightbox(fotos, idx, go); }
  });
  document.body.style.overflow = "hidden";
  location.hash = "produto-" + p.id;
  $(".sheet .close", root).focus();
}

function closeDetail(){
  $("#modalRoot").innerHTML = "";
  document.body.style.overflow = "";
  if(location.hash) history.replaceState(null,"",location.pathname + location.search);
  if(lastFocus) lastFocus.focus();
}

function openLightbox(fotos, start, syncBack){
  let i = start;
  const box = document.createElement("div");
  box.className = "lightbox";
  box.innerHTML = '<button class="icon-btn close" data-lclose aria-label="Fechar">'+ICON.close+'</button>'
    + (fotos.length>1 ? '<button class="nav-arrow prev" data-lstep="-1" aria-label="Anterior">'+ICON.left+'</button>' : '')
    + '<img src="'+esc(fotos[i])+'" alt="Foto ampliada '+(i+1)+' de '+fotos.length+'">'
    + (fotos.length>1 ? '<button class="nav-arrow next" data-lstep="1" aria-label="Próxima">'+ICON.right+'</button>' : '');
  document.body.appendChild(box);
  const img = box.querySelector("img");
  function show(n){
    i = (n + fotos.length) % fotos.length;
    img.src = fotos[i]; img.alt = "Foto ampliada "+(i+1)+" de "+fotos.length;
    syncBack && syncBack(i);
  }
  function close(){ box.remove(); document.removeEventListener("keydown", key); }
  function key(e){
    if(e.key === "Escape") close();
    if(e.key === "ArrowLeft") show(i-1);
    if(e.key === "ArrowRight") show(i+1);
  }
  box.addEventListener("click", e => {
    const st = e.target.closest("[data-lstep]");
    if(st) return show(i + Number(st.dataset.lstep));
    if(e.target.closest("[data-lclose]") || e.target === box) close();
  });
  document.addEventListener("keydown", key);
  box.querySelector("[data-lclose]").focus();
}

async function share(p){
  const url = location.origin + location.pathname + "#produto-" + p.id;
  const data = { title: p.titulo, text: p.titulo + " — " + brl(p.valor), url };
  if(navigator.share){
    try{ await navigator.share(data); return; }catch(e){ if(e.name === "AbortError") return; }
  }
  try{ await navigator.clipboard.writeText(url); toast("Link copiado"); }
  catch{ prompt("Copie o link do anúncio:", url); }
}

   9. INICIALIZAÇÃO
   ============================================================ */
(async function init(){
  // marca
  $("#brandName").textContent = CONFIG.storeName;
  $("#footBrand").textContent = CONFIG.storeName;
  document.title = CONFIG.storeName + " — Catálogo de anúncios";
  $("#footPhone").textContent = CONFIG.whatsappLabel;
  $("#footPhone").href = "https://wa.me/" + CONFIG.whatsapp;

  Theme.init();
  showSkeletons();

  await Store.load();

  renderChips(); renderStats(); renderGrid();
  if(Store.erro){
    $("#produtos").innerHTML = '<li style="grid-column:1/-1"><div class="empty">'
      + '<h3>Não foi possível carregar os produtos</h3>'
      + '<p>Verifique a conexão e atualize a página.</p></div></li>';
  }

  // pesquisa em tempo real
  let t;
  $("#q").addEventListener("input", e => {
    State.q = e.target.value;
    $("#clearQ").hidden = !State.q;
    clearTimeout(t); t = setTimeout(renderGrid, 120);
  });
  $("#clearQ").addEventListener("click", () => {
    State.q = ""; $("#q").value = ""; $("#clearQ").hidden = true; renderGrid(); $("#q").focus();
  });

  $("#chips").addEventListener("click", e => {
    const c = e.target.closest("[data-cat]");
    if(!c) return;
    State.categoria = c.dataset.cat;
    renderChips(); renderGrid();
  });
  $("#status").addEventListener("change", e => { State.status = e.target.value; renderGrid(); });
  $("#sort").addEventListener("change", e => { State.sort = e.target.value; renderGrid(); });

  $("#produtos").addEventListener("click", e => {
    const b = e.target.closest("[data-open]");
    if(b) openDetail(b.dataset.open);
  });

  $("#brandLink").addEventListener("click", e => { e.preventDefault(); window.scrollTo({top:0,behavior:"smooth"}); });

  // abre direto o anúncio quando o link compartilhado tem #produto-ID
  const m = location.hash.match(/^#produto-(\w+)$/);
  if(m && Store.get(m[1])) openDetail(m[1]);
})();
