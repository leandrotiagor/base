<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LT Sistemas - Vitrine</title>

    <meta name="theme-color" content="#168c8c">

    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        header {
            background: #168c8c;
            padding: 22px 20px;
            color: white;
            text-align: center;
        }

        header h1 {
            margin: 0 0 4px;
            font-size: 24px;
        }

        header p {
            margin: 0;
            font-size: 13px;
            opacity: 0.9;
        }

        .barra-busca {
            max-width: 1100px;
            margin: 20px auto 0;
            padding: 0 20px;
        }

        .barra-busca input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 10px;
            border: 1px solid #d7dfe3;
            font-size: 15px;
            background: white;
        }

        .barra-busca input:focus {
            outline: none;
            border-color: #168c8c;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .grid-vitrine {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 18px;
        }

        .produto-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            transition: transform 0.15s ease;
        }

        .produto-card:hover {
            transform: translateY(-3px);
        }

        .produto-foto-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #eef1f4;
            overflow: hidden;
        }

        .produto-foto-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .produto-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .produto-preco {
            font-size: 18px;
            font-weight: bold;
            color: #168c8c;
        }

        .produto-titulo {
            font-size: 13px;
            color: #4b5563;
            line-height: 1.35;
        }

        .produto-descricao {
            font-size: 12px;
            color: #9ca3af;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .btn-whatsapp {
            margin-top: auto;
            background: #25d366;
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
        }

        .btn-whatsapp:hover {
            background: #1ebe5b;
        }

        .mensagem {
            padding: 60px 20px;
            text-align: center;
            color: #9ca3af;
            font-size: 15px;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #9ca3af;
            font-size: 12px;
        }

    </style>

</head>

<body>

    <header>
        <h1>LT Sistemas</h1>
        <p>Confira nossos produtos disponíveis</p>
    </header>

    <div class="barra-busca">
        <input
            type="text"
            id="campoBusca"
            placeholder="🔍 Buscar produto..."
        >
    </div>

    <div class="container">

        <div id="gridVitrine" class="grid-vitrine">
            <p class="mensagem">Carregando produtos...</p>
        </div>

    </div>

    <footer>
        LT Sistemas © 2026
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="loja.js"></script>

</body>

</html>
