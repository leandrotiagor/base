<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel - Leandro Sistemas</title>


    <!-- ==============================
         CSS
    =============================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- ==============================
         PWA / MANIFEST
    =============================== -->

    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="theme-color"
        content="#111827"
    >


    <!-- ÍCONES -->

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="icon-192.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="512x512"
        href="icon-512.png"
    >

</head>


<body>

    <div class="painel-container">


        <!-- ==============================
             CABEÇALHO
        =============================== -->

        <header class="painel-header">

            <div>

                <h1>
                    SEJA BEM VINDO(A) AO LEANDRO SISTEMAS
                </h1>

                <p id="nomeUsuario">
                    Carregando...
                </p>

                <p id="climaInfo" class="clima-info">
                    <span id="climaCidade">Obtendo localização...</span>
                    <span id="climaTemp"></span>
                </p>

            </div>


            <div class="header-botoes">

                <div
                    id="adminArea"
                    style="display: none;"
                >

                    <button
                        id="btnAuditoria"
                        class="btn-sair"
                        type="button"
                    >
                        📊 Auditoria
                    </button>

                </div>


                <button
                    id="btnTrocarSenha"
                    class="btn-sair"
                    type="button"
                >
                    🔑 Troque sua senha
                </button>


                <button
                    id="btnSair"
                    class="btn-sair"
                    type="button"
                >
                    Sair
                </button>

            </div>

        </header>


        <!-- ==============================
             CONTEÚDO
        =============================== -->

        <main>

            <h2>
                Módulos
            </h2>


            <!-- MÓDULOS -->

            <div
                id="modulos"
                class="modulos-grid"
            >

                <p>
                    Carregando módulos...
                </p>

            </div>


        </main>

    </div>


    <!-- ==============================
         MODAL TROCAR SENHA
    =============================== -->

    <div
        id="modalTrocarSenha"
        class="modal-overlay"
        style="display: none;"
    >

        <div class="modal-caixa">

            <div class="modal-cabecalho">

                <h2>
                    🔑 Trocar senha
                </h2>

                <button
                    id="btnFecharTrocarSenha"
                    class="fechar-modal"
                    type="button"
                >
                    ×
                </button>

            </div>

            <form id="formTrocarSenha">

                <label for="novaSenha">
                    Nova senha
                </label>

                <input
                    type="password"
                    id="novaSenha"
                    minlength="6"
                    placeholder="Mínimo de 6 caracteres"
                    required
                >

                <label for="confirmarSenha">
                    Confirmar nova senha
                </label>

                <input
                    type="password"
                    id="confirmarSenha"
                    minlength="6"
                    placeholder="Repita a nova senha"
                    required
                >

                <div class="modal-acoes">

                    <button
                        type="button"
                        id="btnCancelarTrocarSenha"
                        class="btn-cancelar"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn-salvar-senha"
                    >
                        Salvar nova senha
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- ==============================
         DATA / HORA (Horário de Brasília)
    =============================== -->

    <div id="relogioFixo" class="relogio-fixo">
        <div id="relogioData">--/--/----</div>
        <div id="relogioHora">--:--:--</div>
    </div>


    <!-- ==============================
         SUPABASE
    =============================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- ==============================
         CONFIGURAÇÃO SUPABASE
    =============================== -->

    <script src="supabase.js"></script>


    <!-- ==============================
         PAINEL
    =============================== -->

    <script src="painel.js"></script>


</body>

</html>
