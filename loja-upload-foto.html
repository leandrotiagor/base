<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enviar Fotos do Produto - LT Sistemas</title>

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        color: #1f2937;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .card {
        background: white;
        border-radius: 14px;
        padding: 30px 26px;
        max-width: 420px;
        width: 100%;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
        font-size: 20px;
        margin: 0 0 10px;
    }

    p {
        color: #6b7280;
        font-size: 14px;
        margin-bottom: 22px;
    }

    input[type="file"] {
        display: none;
    }

    label.btn-camera {
        display: block;
        background: #168c8c;
        color: #fff;
        font-weight: bold;
        padding: 16px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 15px;
    }

    #preview {
        display: none;
        width: 100%;
        max-height: 320px;
        object-fit: contain;
        border-radius: 10px;
        margin: 18px 0;
    }

    .btn-enviar {
        display: none;
        width: 100%;
        background: #111827;
        color: #fff;
        font-weight: bold;
        padding: 14px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
        margin-top: 12px;
    }

    .btn-trocar {
        display: none;
        width: 100%;
        background: transparent;
        color: #6b7280;
        border: none;
        padding: 10px;
        font-size: 13px;
        cursor: pointer;
        text-decoration: underline;
    }

    .btn-outra {
        display: none;
        width: 100%;
        background: #168c8c;
        color: #fff;
        font-weight: bold;
        border: none;
        padding: 14px;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
        margin-top: 10px;
    }

    .btn-concluir {
        display: none;
        width: 100%;
        background: transparent;
        color: #6b7280;
        border: none;
        padding: 10px;
        font-size: 13px;
        cursor: pointer;
        text-decoration: underline;
        margin-top: 4px;
    }

    .estado-mensagem {
        font-size: 15px;
        font-weight: bold;
        margin-top: 10px;
    }

    .icone-grande {
        font-size: 48px;
        margin-bottom: 14px;
    }

    .contador {
        font-size: 13px;
        color: #168c8c;
        font-weight: bold;
        margin-top: -10px;
        margin-bottom: 18px;
    }

</style>

</head>

<body>

    <div class="card" id="card">
        <div class="icone-grande">📷</div>
        <h1>Enviar fotos do produto</h1>
        <p id="textoInstrucao">Tire uma foto ou escolha uma da galeria.</p>
        <p id="contador" class="contador" style="display:none;"></p>

        <label class="btn-camera" id="btnCamera" for="inputFoto">
            📷 Tirar / escolher foto
        </label>

        <input type="file" id="inputFoto" accept="image/*" capture="environment">

        <img id="preview" alt="Prévia da foto selecionada">

        <button class="btn-enviar" id="btnEnviar" type="button">Confirmar e enviar</button>
        <button class="btn-trocar" id="btnTrocar" type="button">Escolher outra foto</button>

        <button class="btn-outra" id="btnOutra" type="button">📷 Enviar mais uma foto</button>
        <button class="btn-concluir" id="btnConcluir" type="button">Concluir envio</button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

<script>

    const parametros = new URLSearchParams(window.location.search);
    const sessaoId = parametros.get('sessao');

    const card = document.getElementById('card');
    const textoInstrucao = document.getElementById('textoInstrucao');
    const contadorEl = document.getElementById('contador');
    const btnCamera = document.getElementById('btnCamera');
    const inputFoto = document.getElementById('inputFoto');
    const preview = document.getElementById('preview');
    const btnEnviar = document.getElementById('btnEnviar');
    const btnTrocar = document.getElementById('btnTrocar');
    const btnOutra = document.getElementById('btnOutra');
    const btnConcluir = document.getElementById('btnConcluir');

    let arquivoSelecionado = null;
    let totalEnviadas = 0;

    function mostrarMensagemFinal(icone, titulo, texto) {
        card.innerHTML = `
            <div class="icone-grande">${icone}</div>
            <h1>${titulo}</h1>
            <p class="estado-mensagem">${texto}</p>
        `;
    }

    if (!sessaoId) {
        mostrarMensagemFinal('⚠️', 'Link inválido', 'Gere um novo QR Code pelo sistema.');
    }

    function atualizarContador() {

        if (totalEnviadas === 0) {
            contadorEl.style.display = 'none';
            return;
        }

        contadorEl.style.display = 'block';
        contadorEl.textContent =
            `${totalEnviadas} foto(s) já enviada(s) com sucesso.`;
    }

    function estadoEscolherFoto() {
        preview.style.display = 'none';
        btnEnviar.style.display = 'none';
        btnTrocar.style.display = 'none';
        btnOutra.style.display = 'none';
        btnConcluir.style.display = 'none';
        btnCamera.style.display = 'block';
        inputFoto.value = '';
        arquivoSelecionado = null;
        textoInstrucao.textContent = totalEnviadas > 0
            ? 'Pode tirar outra foto do mesmo produto.'
            : 'Tire uma foto ou escolha uma da galeria.';
    }

    inputFoto.addEventListener('change', () => {

        const arquivo = inputFoto.files[0];

        if (!arquivo) return;

        arquivoSelecionado = arquivo;

        const leitor = new FileReader();
        leitor.onload = (evento) => {
            preview.src = evento.target.result;
            preview.style.display = 'block';
            btnEnviar.style.display = 'block';
            btnTrocar.style.display = 'block';
            btnCamera.style.display = 'none';
            btnOutra.style.display = 'none';
            btnConcluir.style.display = 'none';
            textoInstrucao.textContent = 'Confira a foto antes de enviar.';
        };
        leitor.readAsDataURL(arquivo);
    });

    btnTrocar.addEventListener('click', estadoEscolherFoto);

    btnOutra.addEventListener('click', estadoEscolherFoto);

    btnConcluir.addEventListener('click', () => {
        mostrarMensagemFinal(
            '✅',
            'Tudo enviado!',
            `${totalEnviadas} foto(s) enviada(s). Pode fechar essa aba e voltar pro computador.`
        );
    });

    btnEnviar.addEventListener('click', async () => {

        if (!arquivoSelecionado || !sessaoId) return;

        btnEnviar.disabled = true;
        btnEnviar.textContent = 'Enviando...';

        try {

            const extensao =
                (arquivoSelecionado.name.split('.').pop() || 'jpg').toLowerCase();

            const nomeArquivo =
                `celular_${sessaoId}_${Date.now()}.${extensao}`;

            const { error: erroUpload } = await supabaseClient
                .storage
                .from('loja-fotos')
                .upload(nomeArquivo, arquivoSelecionado, {
                    cacheControl: '3600',
                    upsert: true
                });

            if (erroUpload) {
                throw erroUpload;
            }

            const { data: dadosPublicos } = supabaseClient
                .storage
                .from('loja-fotos')
                .getPublicUrl(nomeArquivo);

            // Usa uma função no banco (RPC) pra adicionar essa foto na
            // sessão, sem precisar de permissão de leitura pro celular.
            const { error: erroRpc } = await supabaseClient
                .rpc('adicionar_foto_sessao', {
                    p_sessao_id: sessaoId,
                    p_foto_url: dadosPublicos.publicUrl
                });

            if (erroRpc) {
                throw erroRpc;
            }

            totalEnviadas += 1;
            atualizarContador();

            preview.style.display = 'none';
            btnEnviar.style.display = 'none';
            btnTrocar.style.display = 'none';
            btnOutra.style.display = 'block';
            btnConcluir.style.display = 'block';
            textoInstrucao.textContent = '✅ Foto enviada! Já apareceu no computador.';

        } catch (erro) {

            console.error('Erro ao enviar foto:', erro);

            mostrarMensagemFinal(
                '❌',
                'Erro ao enviar',
                erro.message || 'Verifique sua internet e tente novamente.'
            );

        } finally {

            btnEnviar.disabled = false;
            btnEnviar.textContent = 'Confirmar e enviar';
        }
    });

</script>

</body>

</html>
