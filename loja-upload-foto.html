<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enviar fotos do produto</title>

    <meta name="theme-color" content="#168c8c">

    <style>

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
            padding: 20px 16px 40px;
        }

        .caixa {
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            border-radius: 14px;
            padding: 22px 18px 26px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
        }

        h1 { font-size: 20px; margin: 0 0 6px; }

        p.ajuda { color: #6b7280; font-size: 14px; margin: 0 0 18px; }

        .botao {
            display: block;
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .botao.principal { background: #168c8c; color: #fff; }
        .botao.escuro    { background: #111827; color: #fff; }
        .botao.leve      { background: #e5e7eb; color: #111827; }
        .botao:disabled  { opacity: .55; }

        .fotos {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 16px 0 6px;
        }

        .foto {
            position: relative;
            width: 88px;
            height: 88px;
            border-radius: 10px;
            overflow: hidden;
            background: #eef1f4;
            border: 1px solid #e5e7eb;
        }

        .foto img { width: 100%; height: 100%; object-fit: cover; }

        .foto .barra {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, .75);
            font-size: 12px;
            color: #168c8c;
            font-weight: bold;
        }

        .contador { font-size: 13px; color: #6b7280; margin: 4px 0 16px; }

        .aviso {
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 14px;
        }

        .aviso.ok   { background: #dcfce7; color: #15803d; }
        .aviso.erro { background: #fde8e8; color: #b42318; }

    </style>

</head>

<body>

    <div class="caixa">

        <h1>📷 Fotos do produto</h1>

        <p class="ajuda" id="ajuda">
            Tire as fotos ou escolha da galeria. Elas aparecem no computador
            automaticamente.
        </p>

        <div id="aviso"></div>

        <div id="area">

            <button type="button" class="botao principal" id="btnCamera">
                Tirar foto agora
            </button>

            <button type="button" class="botao escuro" id="btnGaleria">
                Escolher da galeria
            </button>

            <div class="fotos" id="fotos"></div>

            <p class="contador" id="contador">Nenhuma foto enviada ainda.</p>

            <button type="button" class="botao leve" id="btnConcluir">
                Concluir envio
            </button>

        </div>

        <input type="file" id="entradaCamera"  accept="image/*" capture="environment" hidden>
        <input type="file" id="entradaGaleria" accept="image/*" multiple hidden>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>

        const BUCKET_FOTOS = 'loja-fotos';

        const parametros = new URLSearchParams(window.location.search);
        const sessaoId = parametros.get('sessao');
        const maximo = Math.min(Number(parametros.get('max')) || 5, 5);

        const areaEl = document.getElementById('area');
        const avisoEl = document.getElementById('aviso');
        const fotosEl = document.getElementById('fotos');
        const contadorEl = document.getElementById('contador');

        const btnCamera = document.getElementById('btnCamera');
        const btnGaleria = document.getElementById('btnGaleria');
        const btnConcluir = document.getElementById('btnConcluir');

        const entradaCamera = document.getElementById('entradaCamera');
        const entradaGaleria = document.getElementById('entradaGaleria');

        let fotosEnviadas = [];

        function mostrarAviso(texto, tipo) {
            avisoEl.innerHTML =
                '<div class="aviso ' + tipo + '">' + texto + '</div>';
        }

        function desenhar() {

            fotosEl.innerHTML = fotosEnviadas
                .map((url) => '<div class="foto"><img src="' + url + '" alt=""></div>')
                .join('');

            contadorEl.textContent = fotosEnviadas.length
                ? fotosEnviadas.length + ' de ' + maximo + ' foto(s) enviada(s).'
                : 'Nenhuma foto enviada ainda.';

            const cheio = fotosEnviadas.length >= maximo;
            btnCamera.disabled = cheio;
            btnGaleria.disabled = cheio;
        }

        function marcarEnviando(quantidade) {
            for (let i = 0; i < quantidade; i++) {
                const div = document.createElement('div');
                div.className = 'foto';
                div.innerHTML = '<div class="barra">enviando…</div>';
                fotosEl.appendChild(div);
            }
        }

        async function enviarArquivo(arquivo) {

            const extensao = (arquivo.name.split('.').pop() || 'jpg').toLowerCase();

            const nome = 'produto_' + Date.now() + '_' +
                Math.random().toString(36).slice(2) + '.' + extensao;

            const { error } = await supabaseClient
                .storage
                .from(BUCKET_FOTOS)
                .upload(nome, arquivo, { cacheControl: '3600', upsert: false });

            if (error) {
                throw error;
            }

            const { data } = supabaseClient
                .storage
                .from(BUCKET_FOTOS)
                .getPublicUrl(nome);

            return data.publicUrl;
        }

        async function salvarNaSessao() {

            const { error } = await supabaseClient
                .from('loja_upload_sessoes')
                .update({
                    fotos: fotosEnviadas,
                    foto_url: fotosEnviadas[0] || null,
                    status: 'aguardando'
                })
                .eq('id', sessaoId);

            if (error) {
                throw error;
            }
        }

        async function processar(arquivos) {

            const lista = Array.from(arquivos || []);

            if (!lista.length) {
                return;
            }

            const espaco = maximo - fotosEnviadas.length;

            if (espaco <= 0) {
                mostrarAviso('Limite de ' + maximo + ' fotos atingido.', 'erro');
                return;
            }

            const selecionados = lista.slice(0, espaco);

            avisoEl.innerHTML = '';
            marcarEnviando(selecionados.length);

            try {

                for (const arquivo of selecionados) {
                    const url = await enviarArquivo(arquivo);
                    fotosEnviadas.push(url);
                    await salvarNaSessao();
                    desenhar();
                }

                mostrarAviso('Foto(s) enviada(s). Já apareceram no computador.', 'ok');

            } catch (erro) {

                console.error(erro);
                desenhar();
                mostrarAviso(
                    'Não foi possível enviar: ' + (erro.message || 'erro desconhecido'),
                    'erro'
                );
            }
        }

        btnCamera.addEventListener('click', () => entradaCamera.click());
        btnGaleria.addEventListener('click', () => entradaGaleria.click());

        entradaCamera.addEventListener('change', async (e) => {
            await processar(e.target.files);
            entradaCamera.value = '';
        });

        entradaGaleria.addEventListener('change', async (e) => {
            await processar(e.target.files);
            entradaGaleria.value = '';
        });

        btnConcluir.addEventListener('click', async () => {

            btnConcluir.disabled = true;
            btnConcluir.textContent = 'Finalizando...';

            try {

                const { error } = await supabaseClient
                    .from('loja_upload_sessoes')
                    .update({
                        fotos: fotosEnviadas,
                        foto_url: fotosEnviadas[0] || null,
                        status: 'concluido'
                    })
                    .eq('id', sessaoId);

                if (error) {
                    throw error;
                }

                areaEl.innerHTML = '';
                document.getElementById('ajuda').textContent =
                    'Pode fechar esta página e continuar o cadastro no computador.';
                mostrarAviso('✅ Envio concluído!', 'ok');

            } catch (erro) {

                console.error(erro);
                btnConcluir.disabled = false;
                btnConcluir.textContent = 'Concluir envio';
                mostrarAviso(
                    'Não foi possível finalizar: ' + (erro.message || 'erro'),
                    'erro'
                );
            }
        });

        // início
        (function iniciar() {

            if (!sessaoId) {
                areaEl.innerHTML = '';
                mostrarAviso('Link inválido. Gere o QR Code novamente no sistema.', 'erro');
                return;
            }

            desenhar();
        })();

    </script>

</body>

</html>
