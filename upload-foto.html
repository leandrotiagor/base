<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enviar Foto - LT Sistemas</title>

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        color: #1f2937;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .card {
        background: white;
        border-radius: 14px;
        padding: 30px 26px;
        max-width: 420px;
        width: 100%;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
        font-size: 20px;
        margin: 0 0 10px;
    }

    p {
        color: #6b7280;
        font-size: 14px;
        margin-bottom: 22px;
    }

    input[type="file"] {
        display: none;
    }

    label.btn-camera {
        display: block;
        background: #168c8c;
        color: #fff;
        font-weight: bold;
        padding: 16px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 15px;
    }

    #preview {
        display: none;
        width: 100%;
        max-height: 320px;
        object-fit: contain;
        border-radius: 10px;
        margin: 18px 0;
    }

    .btn-enviar {
        display: none;
        width: 100%;
        background: #111827;
        color: #fff;
        font-weight: bold;
        padding: 14px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
        margin-top: 12px;
    }

    .btn-trocar {
        display: none;
        width: 100%;
        background: transparent;
        color: #6b7280;
        border: none;
        padding: 10px;
        font-size: 13px;
        cursor: pointer;
        text-decoration: underline;
    }

    .estado-mensagem {
        font-size: 15px;
        font-weight: bold;
        margin-top: 10px;
    }

    .icone-grande {
        font-size: 48px;
        margin-bottom: 14px;
    }

</style>

</head>

<body>

    <div class="card" id="card">
        <div class="icone-grande">📸</div>
        <h1>Enviar foto</h1>
        <p id="textoInstrucao">Tire uma foto ou escolha uma da galeria. A IA vai ler o texto dela automaticamente.</p>

        <label class="btn-camera" id="btnCamera" for="inputFoto">
            📷 Tirar / escolher foto
        </label>

        <input type="file" id="inputFoto" accept="image/*" capture="environment">

        <img id="preview" alt="Prévia da foto selecionada">

        <button class="btn-enviar" id="btnEnviar" type="button">Confirmar e enviar</button>
        <button class="btn-trocar" id="btnTrocar" type="button">Escolher outra foto</button>

    </div>

<script>

    const parametros = new URLSearchParams(window.location.search);
    const sessaoId = parametros.get('sessao');

    const card = document.getElementById('card');
    const textoInstrucao = document.getElementById('textoInstrucao');
    const btnCamera = document.getElementById('btnCamera');
    const inputFoto = document.getElementById('inputFoto');
    const preview = document.getElementById('preview');
    const btnEnviar = document.getElementById('btnEnviar');
    const btnTrocar = document.getElementById('btnTrocar');

    let arquivoSelecionado = null;

    function mostrarMensagemFinal(icone, titulo, texto) {
        card.innerHTML = `
            <div class="icone-grande">${icone}</div>
            <h1>${titulo}</h1>
            <p class="estado-mensagem">${texto}</p>
        `;
    }

    if (!sessaoId) {
        mostrarMensagemFinal('⚠️', 'Link inválido', 'Escaneie o QR Code novamente pelo sistema.');
    }

    inputFoto.addEventListener('change', () => {

        const arquivo = inputFoto.files[0];

        if (!arquivo) return;

        arquivoSelecionado = arquivo;

        const leitor = new FileReader();
        leitor.onload = (evento) => {
            preview.src = evento.target.result;
            preview.style.display = 'block';
            btnEnviar.style.display = 'block';
            btnTrocar.style.display = 'block';
            btnCamera.style.display = 'none';
            textoInstrucao.textContent = 'Confira a foto antes de enviar.';
        };
        leitor.readAsDataURL(arquivo);
    });

    btnTrocar.addEventListener('click', () => {
        inputFoto.value = '';
        preview.style.display = 'none';
        btnEnviar.style.display = 'none';
        btnTrocar.style.display = 'none';
        btnCamera.style.display = 'block';
        textoInstrucao.textContent = 'Tire uma foto ou escolha uma da galeria. A IA vai ler o texto dela automaticamente.';
    });

    btnEnviar.addEventListener('click', async () => {

        if (!arquivoSelecionado) return;

        btnEnviar.disabled = true;
        btnEnviar.textContent = 'Enviando...';

        try {

            const base64Completo = await new Promise((resolve, reject) => {
                const leitor = new FileReader();
                leitor.onload = () => resolve(leitor.result);
                leitor.onerror = reject;
                leitor.readAsDataURL(arquivoSelecionado);
            });

            // Remove o prefixo "data:image/jpeg;base64," antes de enviar
            const base64Puro = base64Completo.split(',')[1];

            const CHAVE_PUBLICA = 'sb_publishable_Ep0zPdN8-GToiegta4fT9w_Gxf-8du_';

            const resposta = await fetch(
                'https://homcoqxvnskmhkofwyef.supabase.co/functions/v1/transcrever-foto',
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': CHAVE_PUBLICA,
                        'Authorization': 'Bearer ' + CHAVE_PUBLICA
                    },
                    body: JSON.stringify({
                        sessao_id: sessaoId,
                        imagem_base64: base64Puro,
                        mime_type: arquivoSelecionado.type
                    })
                }
            );

            let dados = null;
            let textoBruto = null;

            try {
                dados = await resposta.json();
            } catch (e) {
                textoBruto = await resposta.text().catch(() => null);
            }

            if (!resposta.ok || dados?.erro) {
                const detalhe = dados?.erro || textoBruto || `Erro ${resposta.status}`;
                mostrarMensagemFinal('❌', 'Não foi possível enviar', detalhe);
                return;
            }

            mostrarMensagemFinal('✅', 'Foto enviada!', 'Pode fechar essa aba e voltar pro computador — o texto já vai aparecer lá.');

        } catch (erro) {
            console.error('Erro ao enviar foto:', erro);
            mostrarMensagemFinal('❌', 'Erro ao enviar', erro.message || 'Verifique sua internet e tente novamente.');
        }
    });

</script>

</body>

</html>
